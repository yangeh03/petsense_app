name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a production deployment with a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint / Typecheck / Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # 路径感知：app/ 无变更时跳过整条客户端检查链（重头的 expo Web 构建约 45s）
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
      - uses: actions/setup-node@v6
        if: steps.filter.outputs.app == 'true'
        with:
          node-version-file: 'app/.nvmrc'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 安装依赖
        if: steps.filter.outputs.app == 'true'
        working-directory: app
        run: npm ci
      # expo-env.d.ts 不入库（Expo 官方约定），CI 中生成以供 tsc 使用
      - name: 生成 Expo 类型声明
        if: steps.filter.outputs.app == 'true'
        run: echo '/// <reference types="expo/types" />' > app/expo-env.d.ts
      - name: Prettier 格式检查
        if: steps.filter.outputs.app == 'true'
        working-directory: app
        run: npm run format:check
      - name: ESLint
        if: steps.filter.outputs.app == 'true'
        working-directory: app
        run: npm run lint
      - name: TypeScript 类型检查
        if: steps.filter.outputs.app == 'true'
        working-directory: app
        run: npm run typecheck
      - name: Web 构建验证
        if: steps.filter.outputs.app == 'true'
        working-directory: app
        run: npx expo export --platform web
      - name: 客户端状态回归测试
        if: steps.filter.outputs.app == 'true'
        working-directory: app
        run: npm test

  server:
    name: Server tests / Model validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'tools/offline-map/**'
              - '.github/workflows/ci.yml'
      # workflow_dispatch 视为强制部署（保持原 Run workflow 语义）
      - name: 决定是否执行
        id: decide
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "${{ steps.filter.outputs.server }}" = "true" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.decide.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.lock
      - name: 安装锁定的服务端依赖
        if: steps.decide.outputs.run == 'true'
        run: python -m pip install -r server/requirements.lock
      - name: Python 语法和隔离测试
        if: steps.decide.outputs.run == 'true'
        env:
          PETSENSE_MQTT_DISABLED: '1'
        run: |
          python -m compileall -q server
          python -m unittest discover -s server/tests -v
          python -m unittest discover -s tools/offline-map/tests -v
      - name: 验证动作模型可加载
        if: steps.decide.outputs.run == 'true'
        working-directory: server
        run: python -c "from petsense.actions.classifier import ActionClassifier; ActionClassifier('models/random_forest_1s.joblib')"

  ota-update:
    name: EAS Update (OTA)
    needs: [check]
    # 仅 main 直推且 app/ 有变更时发布 OTA；PR 不发布
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.check.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'app/.nvmrc'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 安装依赖
        working-directory: app
        run: npm ci
      # expo-env.d.ts 不入库（Expo 官方约定），打包前生成
      - name: 生成 Expo 类型声明
        run: echo '/// <reference types="expo/types" />' > app/expo-env.d.ts
      - name: 发布 EAS Update
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # 打包期注入生产 REST 地址（缺省会落到 localhost，装到手机上必然连不上）
          EXPO_PUBLIC_API_BASE_URL: http://81.71.71.31
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::缺少 EXPO_TOKEN secret（expo.dev → Account Settings → Access tokens 创建后添加到仓库 secrets）"
            exit 1
          fi
          npx eas-cli@latest update --non-interactive \
            --environment production \
            --branch production \
            --message "auto: ${GITHUB_SHA}"

  deploy:
    name: Deploy Tencent production
    needs: [check, server]
    if: github.ref == 'refs/heads/main' && needs.server.outputs.changed == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: petsense-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: 部署已验证的提交
        env:
          DEPLOY_KEY: ${{ secrets.TENCENT_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TENCENT_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/petsense-deploy-key"
          hosts_file="$RUNNER_TEMP/petsense-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts_file"
          # gzip + 排除 29MB 的动作模型（服务器已有同一份，deploy 会复用现网文件校验），
          # 把跨境传输从 29MB 压到几十 KB，避免被跨境链路限速拖死
          git archive --format=tar HEAD -- server tools/offline-map ':(exclude)server/models' | python server/deploy/package_release.py | ssh \
            -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            ubuntu@81.71.71.31 "deploy $GITHUB_SHA"
          echo "Deployed commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
