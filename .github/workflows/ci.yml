name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a production deployment with a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint / Typecheck / Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # expo-env.d.ts 不入库（Expo 官方约定），CI 中生成以供 tsc 使用
      - name: 生成 Expo 类型声明
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Prettier 格式检查
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: Web 构建验证
        run: npx expo export --platform web

  server:
    name: Server tests / Model validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.lock
      - name: 安装锁定的服务端依赖
        run: python -m pip install -r server/requirements.lock
      - name: Python 语法和隔离测试
        run: |
          python -m compileall -q server
          python -m unittest discover -s server/tests -v
      - name: 验证动作模型可加载
        working-directory: server
        run: python -c "from action_classifier import ActionClassifier; ActionClassifier('models/random_forest_1s.joblib')"
      - name: 检测服务端变更
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ]; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            elif git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -Eq '^(server/|\.github/workflows/ci\.yml$)'; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            else
              echo 'changed=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy Tencent production
    needs: [check, server]
    if: github.ref == 'refs/heads/main' && needs.server.outputs.changed == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: petsense-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: 部署已验证的提交
        env:
          DEPLOY_KEY: ${{ secrets.TENCENT_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TENCENT_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/petsense-deploy-key"
          hosts_file="$RUNNER_TEMP/petsense-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts_file"
          git archive --format=tar HEAD server | ssh \
            -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            ubuntu@81.71.71.31 "deploy $GITHUB_SHA"
          echo "Deployed commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
