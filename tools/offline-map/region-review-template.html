<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>第一版地图 · 区域边界核对</title><style>
body{font:16px/1.6 system-ui,sans-serif;margin:0;background:#f4f2ee;color:#252525}main{max-width:1100px;margin:auto;padding:22px}h1{font-size:25px;margin:0 0 10px}.layout{display:grid;grid-template-columns:1fr 275px;gap:18px}.card{background:white;padding:18px;border-radius:16px}svg{width:100%;touch-action:none;border:1px solid #ddd}button,input,select{font:inherit;max-width:100%;box-sizing:border-box}button{padding:9px 13px;border:1px solid #b8aaa0;background:#fff;border-radius:9px;cursor:pointer;margin:5px 4px 5px 0}input:not([type=checkbox]),select{width:100%;padding:7px}label{display:block;margin:12px 0}small{display:block;color:#555}.status{padding:8px;background:#f5eee2;border-radius:8px}#error{color:#a02c1b}polygon, circle{cursor:pointer}text{pointer-events:none}button:disabled{opacity:.4;cursor:default}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:12px}}
</style><main><h1>第一版地图 · 区域边界核对</h1><p>以下为观察俯视图得到的候选区域，并非已经确认的家具识别结果。请核对位置和名称，勾选确认后再导出。</p>
<div class="layout"><section class="card"><svg id="map" aria-label="拖动顶点修改虚拟区域，点击地图检查区域归属"></svg><p id="hit" class="status">点击地图，检查该位置对应的文字。</p><small>选择一个区域后拖动圆点修改边界；双击边界附近可增加顶点。未确认区域用虚线表示。坐标沿用当前第一版地图，不重新缩放、旋转或镜像底图。</small></section>
<section class="card"><label>区域<select id="areas"></select></label><label>输出文字<input id="name" maxlength="40"></label><label>重叠时优先级<input id="priority" type="number" min="-100" max="100"></label><label><input id="confirmed" type="checkbox"> 已核对名称和边界</label><small id="note"></small><button id="add">新增矩形区域</button><button id="remove">删除此区域</button><hr><p id="error"></p><button id="export">导出已核对配置</button><label>重新导入本地图配置<input id="import" type="file" accept="application/json,.json"></label><small>此页面完全离线。导出文件不会自动修改 App；核对完成后再导入服务器。衣柜和门口的位置尤其需要按现场确认。</small></section></div></main>
<script>
const data=__REGION_DATA__;
const NS='http://www.w3.org/2000/svg', svg=document.querySelector('#map'), select=document.querySelector('#areas');
let regions=data.regions, selected=0, drag=null, marker=null;
const b=data.background;
svg.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);
function world([x,y]){return [b.origin[0]+x*b.metersPerPixel,b.origin[1]+(b.height-y)*b.metersPerPixel]}
function pixel([x,y]){return [(x-b.origin[0])/b.metersPerPixel,b.height-(y-b.origin[1])/b.metersPerPixel]}
function inside(p, poly){let yes=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++) {const a=poly[i],c=poly[j],dx=c[0]-a[0],dy=c[1]-a[1],n=dx*dx+dy*dy,t=n?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/n)):0;if(Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)<1e-7)return true;if((a[1]>p[1])!==(c[1]>p[1])&&p[0]<(c[0]-a[0])*(p[1]-a[1])/(c[1]-a[1])+a[0])yes=!yes}return yes}
function node(tag,attrs,parent=svg){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.append(e);return e}
function at(event){const p=svg.createSVGPoint();p.x=event.clientX;p.y=event.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return world([q.x,q.y])}
function refreshForm(){select.replaceChildren();regions.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${r.label}${r.confirmed?' ✓':'（待确认）'}`;select.append(o)});select.value=selected;const r=regions[selected];document.querySelector('#name').value=r?.label??'';document.querySelector('#priority').value=r?.priority??0;document.querySelector('#confirmed').checked=!!r?.confirmed;document.querySelector('#note').textContent=r?.note??'请按实际现场核对';render()}
function render(){svg.replaceChildren();node('image',{href:data.image,width:b.width,height:b.height});node('polygon',{points:data.outline.map(pixel).map(p=>p.join(',')).join(' '),fill:'none',stroke:'#555','stroke-width':1});
regions.forEach((r,i)=>{const color=`hsl(${i*63%360},65%,35%)`,points=r.polygon.map(pixel);const p=node('polygon',{points:points.map(p=>p.join(',')).join(' '),fill:color,'fill-opacity':i===selected?.21:.1,stroke:color,'stroke-width':i===selected?2.5:1.5,'stroke-dasharray':r.confirmed?'0':'6 4'});p.addEventListener('click',e=>{e.stopPropagation();selected=i;marker=at(e);refreshForm()});
const center=points.reduce((s,p)=>[s[0]+p[0]/points.length,s[1]+p[1]/points.length],[0,0]);node('text',{x:center[0],y:center[1],fill:color,'font-size':13,'font-weight':700,'text-anchor':'middle','paint-order':'stroke',stroke:'#fff','stroke-width':3}).textContent=`${i+1} ${r.label}`;
if(i===selected)points.forEach((p,j)=>{const h=node('circle',{cx:p[0],cy:p[1],r:5,fill:'#fff',stroke:color,'stroke-width':2});h.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();drag=j;svg.setPointerCapture(e.pointerId)})})});
if(marker){const p=pixel(marker);node('circle',{cx:p[0],cy:p[1],r:5,fill:'#222',stroke:'#fff','stroke-width':2})}
const valid=regions.every(r=>r.label.trim()&&Number.isInteger(r.priority)&&r.priority>=-100&&r.priority<=100&&r.polygon.length>=3&&r.polygon.length<=256&&r.polygon.every(p=>p.every(Number.isFinite)&&inside(p,data.outline)));
document.querySelector('#error').style.color=valid?'#555':'#a02c1b';document.querySelector('#error').textContent=valid?'边界由服务器在导入时再次检查；重叠时按优先级选择。':'部分顶点位于轮廓外或配置不完整，请调整。';document.querySelector('#export').disabled=!valid||!regions.some(r=>r.confirmed);
if(marker){const hits=regions.filter(r=>inside(marker,r.polygon)).sort((a,c)=>c.priority-a.priority||a.id.localeCompare(c.id));document.querySelector('#hit').textContent=`坐标 X ${marker[0].toFixed(2)} m，Y ${marker[1].toFixed(2)} m；候选：${hits.map(r=>r.label+(r.confirmed?'':'（待确认）')).join('、')||'未命名区域'}`}}
select.onchange=()=>{selected=Number(select.value);refreshForm()};document.querySelector('#name').oninput=e=>{if(regions[selected])regions[selected].label=e.target.value;render()};document.querySelector('#priority').oninput=e=>{if(regions[selected])regions[selected].priority=Number(e.target.value);render()};document.querySelector('#confirmed').onchange=e=>{if(regions[selected])regions[selected].confirmed=e.target.checked;refreshForm()};
svg.onpointermove=e=>{if(drag===null)return;regions[selected].polygon[drag]=at(e);render()};svg.onpointerup=svg.onpointercancel=()=>{drag=null};svg.onclick=e=>{if(drag!==null)return;marker=at(e);render()};
svg.ondblclick=e=>{const r=regions[selected];if(!r||r.polygon.length>=256)return;const q=at(e);let best=0,dist=Infinity;r.polygon.forEach((a,i)=>{const c=r.polygon[(i+1)%r.polygon.length],dx=c[0]-a[0],dy=c[1]-a[1],n=dx*dx+dy*dy;const t=n?Math.max(0,Math.min(1,((q[0]-a[0])*dx+(q[1]-a[1])*dy)/n)):0;const d=Math.hypot(q[0]-a[0]-t*dx,q[1]-a[1]-t*dy);if(d<dist){dist=d;best=i}});r.polygon.splice(best+1,0,q);render()};
document.querySelector('#add').onclick=()=>{if(regions.length>=64)return;regions.push({id:`area_${Date.now()}`,label:'新区域',priority:10,confirmed:false,polygon:[[280,220],[360,220],[360,280],[280,280]].map(world)});selected=regions.length-1;refreshForm()};
document.querySelector('#remove').onclick=()=>{regions.splice(selected,1);selected=Math.max(0,selected-1);refreshForm()};
document.querySelector('#export').onclick=()=>{const config={mapId:data.mapId,mapVersion:data.mapVersion,mapFingerprint:data.mapFingerprint,baseRevision:data.baseRevision,confirmed:true,regions:regions.map(({note,...r})=>r)};const u=URL.createObjectURL(new Blob([JSON.stringify(config,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='uwb-regions-first-map.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.querySelector('#import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.mapFingerprint!==data.mapFingerprint||d.mapId!==data.mapId||d.mapVersion!==data.mapVersion||!Array.isArray(d.regions)||d.regions.length>64)throw Error('配置不属于当前地图或区域过多');const ids=new Set();for(const r of d.regions){if(!r||typeof r.id!=='string'||!/^[a-zA-Z0-9_-]{1,64}$/.test(r.id)||ids.has(r.id)||typeof r.label!=='string'||!r.label.trim()||r.label.length>40||typeof r.confirmed!=='boolean'||!Number.isInteger(r.priority)||r.priority< -100||r.priority>100||!Array.isArray(r.polygon)||r.polygon.length<3||r.polygon.length>256||!r.polygon.every(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)))throw Error('区域配置格式无效');ids.add(r.id)}regions=d.regions;data.baseRevision=d.baseRevision??data.baseRevision;selected=0;refreshForm()}catch(err){document.querySelector('#error').style.color='#a02c1b';document.querySelector('#error').textContent=err.message}};
refreshForm();
</script></html>
