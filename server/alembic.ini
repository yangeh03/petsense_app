[alembic]
script_location = %(here)s/alembic
# URL 实际取自 petsense.db.engine()（见 env.py），这里仅为占位
sqlalchemy.url = sqlite:///petsense.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
