<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetSense · 端侧识别</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#202824;background:#f4f7f5;font:15px system-ui,sans-serif;letter-spacing:0}header{background:white;border-bottom:1px solid #dbe3df;padding:20px 5%;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:23px;margin:0}header small{color:#69756e}main{max-width:1060px;margin:0 auto;padding:28px 24px}.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:26px}.dot{width:9px;height:9px;border-radius:50%;background:#a7b0aa}.online{background:#279668}.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}section{border-top:3px solid #278f62;padding:22px 0}.sound{border-color:#cd8b28}h2{font-size:16px;font-weight:500;color:#66756c;margin:0 0 12px}.prediction{font-size:36px;font-weight:650;overflow-wrap:anywhere}.meta{font-size:13px;color:#6b756e;margin-top:14px}.bar{height:5px;background:#dce8e1;margin-top:20px}.fill{height:100%;background:#278f62;width:0}.sound .fill{background:#cd8b28}.health{margin-top:28px;border-top:1px solid #dbe3df;padding:24px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.value{font-size:26px;margin-top:10px}.unit{font-size:13px;color:#79837c}.battery{display:inline-flex;align-items:center;gap:8px}.batteryShape{width:27px;height:14px;border:1.5px solid #5c6e63;border-radius:3px;padding:2px}.batteryShape span{display:block;height:100%;background:#278f62}.warning{color:#8b631e;font-size:13px;line-height:1.7}.history{margin-top:25px;border-top:1px solid #dbe3df}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e0e6e2;padding:12px 8px}th{color:#6b756e;font-weight:500}footer{color:#78847d;font-size:12px;margin-top:25px}@media(max-width:600px){main{padding:20px 18px}.grid{gap:18px}.prediction{font-size:27px}.metrics{grid-template-columns:1fr 1fr}header{padding:16px 18px}h1{font-size:20px}header small{display:none}}
</style></head><body>
<header><div><h1>PetSense</h1><small>端侧动作与声音识别</small></div><div class="battery"><span id="battery">--%</span><span class="batteryShape"><span id="batteryFill" style="width:0"></span></span></div></header>
<main><p class="meta">公开调试设备 · petsense-esp32-001</p><div class="status"><span class="dot" id="dot"></span><span id="status">等待设备</span><span class="meta" id="time"></span></div>
<div class="grid"><section><h2>当前动作</h2><div id="action" class="prediction">--</div><div class="bar"><div class="fill" id="actionFill"></div></div><div id="actionMeta" class="meta">--</div></section><section class="sound"><h2>当前声音</h2><div id="sound" class="prediction">--</div><div class="bar"><div class="fill" id="soundFill"></div></div><div id="soundMeta" class="meta">--</div></section></div>
<div class="health"><h2>健康信号</h2><div class="metrics"><div>心率<div class="value"><span id="hr">--</span> <span class="unit">bpm</span></div></div><div>血氧<div class="value"><span id="spo2">--</span> <span class="unit">%</span></div></div><div>模块体温读数<div class="value"><span id="temp">--</span> <span class="unit">°C</span></div></div><div>环境温度<div class="value"><span id="env">--</span> <span class="unit">°C</span></div></div></div><p class="warning" id="healthNote"></p></div>
<div class="history"><table><thead><tr><th>北京时间</th><th>动作</th><th>声音</th></tr></thead><tbody id="history"></tbody></table></div>
<footer id="version">等待端侧模型结果</footer><p class="warning">实验模型 · 胸部佩戴方向尚需实机校验 · 低置信度显示“未确定” · 非医疗诊断</p></main>
<script>
const labels={'standing':'站立','sitting':'坐下','lying down':'趴下','walking':'走路','bark':'汪叫 / 短吠','howl':'嚎叫','whine':'呜咽（实验）','other':'其他声音','quiet':'安静','unknown':'未确定','warming_up':'准备中'};
const el=id=>document.getElementById(id);const text=(id,v)=>el(id).textContent=v;let last=null;
let busy=false;
async function poll(){if(busy)return;busy=true;try{const r=await fetch('/api/debug/edge/latest',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error(r.status);const d=await r.json(),p=d.payload;text('status',d.online?'设备在线':'设备离线');el('dot').className='dot'+(d.online?' online':'');if(!p)return;
text('time',`更新于 ${d.age_s} 秒前`);for(const k of ['action','sound']){const v=p[k]||{};text(k,d.online?(labels[v.label]||v.label||'--'):'--');const score=Math.max(0,Math.min(100,(v.confidence||0)*100));text(k+'Meta',d.online?`置信度 ${score.toFixed(1)}%`:'等待新数据');el(k+'Fill').style.width=(d.online?score:0)+'%';}
const h=p.health||{},valid=d.online&&h.valid;for(const [id,key] of [['hr','heartRate'],['spo2','spo2'],['temp','bodyTemp'],['env','envTemp']])text(id,valid&&h[key]>0?h[key]:'--');text('healthNote',!valid?'暂无有效健康数据':!h.heartRate||!h.spo2?'心率或血氧未测得，请检查佩戴。':'健康模块已返回测量值');
const pct=p.battery?.ok?Math.max(0,Math.min(100,p.battery.percent)):null;text('battery',pct===null?'--%':Math.round(pct)+'%');el('batteryFill').style.width=(pct||0)+'%';text('version',`${p.modelVersion} · ESP32 本地推理 · 动作2秒 / 声音1秒 · 1Hz上报 · 推理耗时 ${p.inference_us||0}µs`);
if(d.online&&p.ts_ms!==last){last=p.ts_ms;const tr=document.createElement('tr');for(const value of [new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}),labels[p.action?.label]||'--',labels[p.sound?.label]||'--']){const td=document.createElement('td');td.textContent=value;tr.appendChild(td)}el('history').prepend(tr);while(el('history').children.length>10)el('history').lastChild.remove();}
}catch(e){text('status','连接中断，请稍后重试');el('dot').className='dot';for(const k of ['action','sound','hr','spo2','temp','env'])text(k,'--');}finally{busy=false}}setInterval(poll,1000);poll();
</script></body></html>
